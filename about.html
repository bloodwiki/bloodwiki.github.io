<div class="site">

    <!-- 共通ヘッダー -->

    <div class="page">

        <!-- 共通サイドバー -->

        <main class="main">

            <div class="content">

                <!-- パンくず -->
                <nav class="breadcrumbs">

                    <a href="index.html">
                        ホーム
                    </a>

                    <span>/</span>

                    <strong>
                        Wikiについて
                    </strong>

                </nav>


                <article class="article">

                    <header class="article-header">

                        <div class="article-category">
                            WIKI

                        <h1>
                            Wikiについて
                        </h1>

                        <p class="article-summary">
                            このWikiの目的や情報の扱いについて。
                        </p>

                    </header>


                    <div class="article-content">

                        <h2>
                            このWikiについて
                        </h2>

                        <p>
                            このWikiは、ゲームに関する情報を
                            プレイヤー同士で整理・共有するための
                            非公式Wikiです。
                        </p>


                        <h2>
                            情報の正確性
                        </h2>

                        <p>
                            ゲーム内で確認した情報や実際の検証結果を
                            もとに記事を作成しています。
                        </p>


                        <h2>
                            情報が未確定の場合
                        </h2>

                        <p>
                            確認できていない情報については、
                            調査・検証ページなどで扱います。
                        </p>


                        <h2>
                            編集について
                        </h2>

                        <p>
                            Wikiの記事は、今後用意する編集システムから
                            変更を提案できるようにする予定です。
                        </p>

                    </div>

                </article>

            </div>
