<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>○○ Wiki</title>

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <link
        rel="stylesheet"
        href="css/layout.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

</head>


<body>

<div class="site">


    <!-- ========================================
         共通ヘッダー
    ========================================= -->

    <div id="site-header"></div>


    <!-- ========================================
         ページ全体
    ========================================= -->

    <div class="page">


        <!-- ====================================
             共通サイドバー
        ===================================== -->

        <div id="site-sidebar"></div>


        <!-- ====================================
             メイン
        ===================================== -->

        <main class="main">

            <div class="content">


                <!-- ==================================
                     ヒーロー
                =================================== -->

                <section class="hero">

                    <div class="hero-label">
                        UNOFFICIAL WIKI
                    </div>


                    <h1>
                        ○○ Wiki
                    </h1>


                    <p>
                        ○○に関する情報をまとめた<br>
                        非公式Wikiです。
                    </p>


                    <div class="hero-search">

                        <span>⌕</span>

                        <input
                            type="search"
                            id="hero-search"
                            placeholder="知りたいことを検索..."
                            autocomplete="off"
                        >

                    </div>

                </section>



                <!-- ==================================
                     カテゴリ
                =================================== -->

                <section>

                    <div class="section-heading">

                        <div>

                            <span class="eyebrow">
                                EXPLORE
                            </span>

                            <h2>
                                Wikiを探索する
                            </h2>

                        </div>

                    </div>


                    <div class="category-grid">


                        <!-- 敵・ボス -->

                        <a
                            href="category.html?category=enemy"
                            class="category-card"
                        >

                            <div
                                class="category-icon enemy"
                            >
                                ⚔
                            </div>


                            <div>

                                <h3>
                                    敵・ボス
                                </h3>

                                <p>
                                    敵のステータスやドロップ、
                                    出現場所など
                                </p>

                            </div>


                            <span class="arrow">
                                →
                            </span>

                        </a>



                        <!-- 釣り -->

                        <a
                            href="category.html?category=fishing"
                            class="category-card"
                        >

                            <div
                                class="category-icon fishing"
                            >
                                ♨
                            </div>


                            <div>

                                <h3>
                                    釣り
                                </h3>

                                <p>
                                    釣れるアイテムや
                                    釣り場など
                                </p>

                            </div>


                            <span class="arrow">
                                →
                            </span>

                        </a>



                        <!-- 装備 -->

                        <a
                            href="category.html?category=equipment"
                            class="category-card"
                        >

                            <div
                                class="category-icon equipment"
                            >
                                ◇
                            </div>


                            <div>

                                <h3>
                                    装備・アクセサリー
                                </h3>

                                <p>
                                    武器やアクセサリーの
                                    性能・入手方法
                                </p>

                            </div>


                            <span class="arrow">
                                →
                            </span>

                        </a>



                        <!-- アイテム -->

                        <a
                            href="category.html?category=item"
                            class="category-card"
                        >

                            <div
                                class="category-icon item"
                            >
                                □
                            </div>


                            <div>

                                <h3>
                                    アイテム
                                </h3>

                                <p>
                                    ゲーム内アイテムの
                                    詳細情報
                                </p>

                            </div>


                            <span class="arrow">
                                →
                            </span>

                        </a>



                        <!-- 地域 -->

                        <a
                            href="category.html?category=area"
                            class="category-card"
                        >

                            <div
                                class="category-icon area"
                            >
                                ⌖
                            </div>


                            <div>

                                <h3>
                                    地域
                                </h3>

                                <p>
                                    各エリアの特徴や
                                    出現する敵など
                                </p>

                            </div>


                            <span class="arrow">
                                →
                            </span>

                        </a>



                        <!-- NPC -->

                        <a
                            href="category.html?category=npc"
                            class="category-card"
                        >

                            <div
                                class="category-icon npc"
                            >
                                ♙
                            </div>


                            <div>

                                <h3>
                                    NPC
                                </h3>

                                <p>
                                    NPCやショップの
                                    情報
                                </p>

                            </div>


                            <span class="arrow">
                                →
                            </span>

                        </a>


                    </div>

                </section>



                <!-- ==================================
                     最近の更新
                =================================== -->

                <section class="home-section">


                    <div class="section-heading">


                        <div>

                            <span class="eyebrow">
                                RECENT
                            </span>

                            <h2>
                                最近の更新
                            </h2>

                        </div>


                        <a
                            href="recent.html"
                            class="text-link"
                        >
                            すべて見る →
                        </a>


                    </div>



                    <div
                        id="recent-articles"
                        class="article-list"
                    >

                        <div class="loading">
                            読み込み中...
                        </div>

                    </div>


                </section>


            </div>

        </main>


    </div>

</div>



<!-- ========================================
     JavaScript
========================================= -->

<script src="js/api.js"></script>
<script src="js/layout.js"></script>


<script>

/*
========================================
最近の更新を読み込む
========================================
*/

async function loadArticles() {

    const container =
        document.getElementById(
            "recent-articles"
        );


    if (!container) return;


    try {

        const result =
            await getArticles();


        if (
            !result ||
            !result.success
        ) {

            throw new Error(
                result?.error ||
                "記事を取得できませんでした"
            );

        }


        const articles =
            result.articles || [];


        displayRecentArticles(
            articles.slice(0, 8)
        );


    } catch (error) {

        console.error(
            "記事読み込みエラー:",
            error
        );


        container.innerHTML = `

            <div class="empty">
                記事を読み込めませんでした。
            </div>

        `;

    }

}


/*
========================================
記事一覧表示
========================================
*/

function displayRecentArticles(
    articles
) {

    const container =
        document.getElementById(
            "recent-articles"
        );


    if (!container) return;


    container.innerHTML = "";


    /*
    記事がない場合
    */

    if (
        !articles ||
        articles.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">
                まだ記事がありません。
            </div>

        `;

        return;

    }


    /*
    記事を生成
    */

    for (
        const article of articles
    ) {

        const element =
            document.createElement("a");


        element.href =
            "article.html?id=" +
            encodeURIComponent(
                article.id
            );


        element.className =
            "article-list-item";


        element.innerHTML = `

            <div class="article-list-main">

                <div class="article-category">

                    ${escapeHtml(
                        article.category
                    )}

                </div>


                <h3>

                    ${escapeHtml(
                        article.title
                    )}

                </h3>


                <p>

                    ${escapeHtml(
                        article.summary
                    )}

                </p>

            </div>


            <span class="article-arrow">
                →
            </span>

        `;


        container.appendChild(
            element
        );

    }

}


/*
========================================
HTMLエスケープ
========================================
*/

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/*
========================================
ヒーロー検索
========================================
*/

function setupHeroSearch() {

    const input =
        document.getElementById(
            "hero-search"
        );


    if (!input) return;


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key !== "Enter"
            ) {
                return;
            }


            const keyword =
                input.value.trim();


            if (!keyword) {
                return;
            }


            location.href =
                "search.html?q=" +
                encodeURIComponent(
                    keyword
                );

        }
    );

}


/*
========================================
開始
========================================
*/

loadArticles();
setupHeroSearch();

</script>


</body>

</html>
