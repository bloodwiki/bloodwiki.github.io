<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wiki</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header>

    <h1>○○ Wiki</h1>

    <input
        id="search"
        type="search"
        placeholder="記事を検索..."
    >

</header>


<main>

    <h2>記事一覧</h2>

    <div id="articles">
        読み込み中...
    </div>

</main>


<script src="js/api.js"></script>

<script>

let allArticles = [];


async function loadArticles() {

    try {

        const result =
            await getArticles();

        if (!result.success) {

            throw new Error(
                result.error
            );

        }

        allArticles =
            result.articles;

        displayArticles(
            allArticles
        );

    } catch (error) {

        console.error(error);

        document
            .getElementById("articles")
            .textContent =
            "記事一覧の読み込みに失敗しました。";

    }

}


function displayArticles(articles) {

    const container =
        document.getElementById(
            "articles"
        );


    container.innerHTML = "";


    if (articles.length === 0) {

        container.textContent =
            "記事がありません。";

        return;

    }


    for (const article of articles) {

        const card =
            document.createElement("a");

        card.href =
            "article.html?id=" +
            encodeURIComponent(
                article.id
            );

        card.className =
            "article-card";


        card.innerHTML = `

            <div class="article-category">
                ${escapeHtml(article.category)}
            </div>

            <h3>
                ${escapeHtml(article.title)}
            </h3>

            <p>
                ${escapeHtml(article.summary)}
            </p>

        `;


        container.appendChild(card);

    }

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


document
    .getElementById("search")
    .addEventListener(
        "input",
        event => {

            const keyword =
                event.target.value
                    .trim()
                    .toLowerCase();


            if (!keyword) {

                displayArticles(
                    allArticles
                );

                return;

            }


            const filtered =
                allArticles.filter(
                    article =>

                        article.title
                            .toLowerCase()
                            .includes(keyword)

                        ||

                        article.summary
                            .toLowerCase()
                            .includes(keyword)

                        ||

                        article.category
                            .toLowerCase()
                            .includes(keyword)

                );


            displayArticles(
                filtered
            );

        }
    );


loadArticles();

</script>

</body>

</html>
