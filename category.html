<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>カテゴリ - BLOOD Wiki</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

</head>


<body>

<div class="site">

    <!-- 共通ヘッダー -->
    <div id="site-header"></div>


    <div class="page">

        <!-- 共通サイドバー -->
        <div id="site-sidebar"></div>


        <!-- メイン -->

        <main class="main">

            <div class="content">

                <!-- パンくず -->

                <nav class="breadcrumbs">

                    <a href="index.html">
                        ホーム
                    </a>

                    <span>/</span>

                    <a
                        href="#"
                        id="breadcrumb"
                    >
                        カテゴリ
                    </a>

                </nav>


                <!-- カテゴリ見出し -->

                <header class="page-heading">

                    <div
                        class="eyebrow"
                        id="category-eyebrow"
                    >
                        CATEGORY
                    </div>

                    <h1 id="category-title">
                        カテゴリ
                    </h1>

                    <p id="category-description">
                        Wikiの記事一覧です。
                    </p>

                </header>


                <!-- サブカテゴリー -->

                <div
                    class="category-filter"
                    id="category-filter"
                >

                    <label
                        for="subcategory-select"
                    >
                        サブカテゴリー
                    </label>


                    <select
                        id="subcategory-select"
                    >

                        <option value="">
                            すべて
                        </option>

                    </select>

                </div>


                <!-- 記事数 -->

                <div
                    id="article-count"
                    class="article-count"
                >
                </div>


                <!-- 記事一覧 -->

                <div
                    id="articles"
                    class="article-list"
                >

                    <div class="loading">
                        読み込み中...
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- 共通処理 -->

<script src="js/api.js"></script>
<script src="js/layout.js"></script>


<script>

/*
========================================
カテゴリ一覧
========================================
*/

const categories = {

    enemy: {
        name: "敵",
        description:
            "ゲーム内に登場する敵についての情報です。"
    },

    boss: {
        name: "ボス",
        description:
            "ゲーム内に登場するボスについての情報です。"
    },

    fishing: {
        name: "釣り",
        description:
            "釣りで入手できるものや釣り場、釣りに関する情報です。"
    },

    weapon: {
        name: "武器",
        description:
            "武器の性能や入手方法などの情報です。"
    },

    armor: {
        name: "防具",
        description:
            "防具の性能や入手方法などの情報です。"
    },

    accessory: {
        name: "アクセサリー",
        description:
            "アクセサリーの性能や入手方法などの情報です。"
    },

    item: {
        name: "アイテム",
        description:
            "ゲーム内に登場するアイテムについての情報です。"
    },

    npc: {
        name: "NPC",
        description:
            "NPCやショップ、取引などについての情報です。"
    },

    biome: {
        name: "エリア",
        description:
            "エリア・バイオームについての情報です。"
    },

    guide: {
        name: "攻略",
        description:
            "その他攻略に役立つ情報です。"
    }

};


/*
========================================
現在の状態
========================================
*/

let allCategoryArticles = [];

let currentSubCategory = "";


/*
========================================
カテゴリ読み込み
========================================
*/

async function loadCategory() {

    const params =
        new URLSearchParams(
            location.search
        );


    const category =
        params.get("category");


    const info =
        categories[category];


    /*
    カテゴリが存在しない場合
    */

    if (!info) {

        showError(
            "指定されたカテゴリが存在しません。"
        );

        return;

    }


    /*
    ページタイトル
    */

    document.title =
        info.name +
        " - BLOOD Wiki";


    /*
    パンくず
    */

    const breadcrumb =
        document.getElementById(
            "breadcrumb"
        );


    breadcrumb.textContent =
        info.name;


    breadcrumb.href =
        "category.html?category=" +
        encodeURIComponent(
            category
        );


    /*
    見出し
    */

    document
        .getElementById(
            "category-title"
        )
        .textContent =
        info.name;


    document
        .getElementById(
            "category-description"
        )
        .textContent =
        info.description;


    /*
    記事取得
    */

    try {

        const result =
            await getArticles();


        if (!result.success) {

            throw new Error(
                result.error
            );

        }


        /*
        カテゴリで絞り込み
        */

        allCategoryArticles =
            result.articles.filter(
                article =>
                    article.category ===
                    info.name
            );


        /*
        サブカテゴリー生成
        */

        populateSubCategories();


        /*
        URLからサブカテゴリーを復元
        */

        const subCategory =
            params.get(
                "subcategory"
            );


        if (
            subCategory &&
            isValidSubCategory(
                subCategory
            )
        ) {

            currentSubCategory =
                subCategory;


            document
                .getElementById(
                    "subcategory-select"
                )
                .value =
                subCategory;

        }


        /*
        記事表示
        */

        updateArticleList();


    } catch (error) {

        console.error(error);

        showError(
            "記事の読み込みに失敗しました。"
        );

    }

}


/*
========================================
サブカテゴリー一覧
========================================
*/

function populateSubCategories() {

    const select =
        document.getElementById(
            "subcategory-select"
        );


    select.innerHTML = "";


    /*
    すべて
    */

    const allOption =
        document.createElement(
            "option"
        );


    allOption.value =
        "";


    allOption.textContent =
        "すべて";


    select.appendChild(
        allOption
    );


    /*
    サブカテゴリーを抽出
    */

    const subCategories = [];


    for (
        const article
        of allCategoryArticles
    ) {

        const subCategory =
            String(
                article.subCategory || ""
            ).trim();


        if (
            !subCategory
        ) {

            continue;

        }


        if (
            subCategories.indexOf(
                subCategory
            ) === -1
        ) {

            subCategories.push(
                subCategory
            );

        }

    }


    /*
    並び順
    */

    subCategories.sort(
        function(a, b) {

            return a.localeCompare(
                b,
                "ja"
            );

        }
    );


    /*
    選択肢生成
    */

    for (
        const subCategory
        of subCategories
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            subCategory;


        option.textContent =
            subCategory;


        select.appendChild(
            option
        );

    }


    /*
    変更イベント
    */

    select.onchange =
        function() {

            currentSubCategory =
                select.value;


            /*
            URLにも反映
            */

            const params =
                new URLSearchParams(
                    location.search
                );


            if (
                currentSubCategory
            ) {

                params.set(
                    "subcategory",
                    currentSubCategory
                );

            } else {

                params.delete(
                    "subcategory"
                );

            }


            history.replaceState(
                null,
                "",
                "category.html?" +
                params.toString()
            );


            updateArticleList();

        };

}


/*
========================================
サブカテゴリー存在確認
========================================
*/

function isValidSubCategory(
    subCategory
) {

    return allCategoryArticles.some(
        article =>
            String(
                article.subCategory || ""
            ).trim()
            ===
            subCategory
    );

}


/*
========================================
記事一覧更新
========================================
*/

function updateArticleList() {

    let articles =
        allCategoryArticles;


    /*
    サブカテゴリーで絞り込み
    */

    if (
        currentSubCategory
    ) {

        articles =
            articles.filter(
                article =>
                    String(
                        article.subCategory || ""
                    ).trim()
                    ===
                    currentSubCategory
            );

    }


    displayArticles(
        articles
    );

}


/*
========================================
記事一覧表示
========================================
*/

function displayArticles(
    articles
) {

    const container =
        document.getElementById(
            "articles"
        );


    /*
    件数
    */

    document
        .getElementById(
            "article-count"
        )
        .textContent =
        `${articles.length} 件の記事`;


    /*
    一覧を空にする
    */

    container.innerHTML = "";


    /*
    記事がない場合
    */

    if (
        articles.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                この条件に一致する記事がありません。

            </div>

        `;

        return;

    }


    /*
    記事を生成
    */

    for (
        const article
        of articles
    ) {

        const element =
            document.createElement(
                "a"
            );


        element.href =
            "article.html?id=" +
            encodeURIComponent(
                article.id
            );


        element.className =
            "article-list-item";


        const subCategory =
            String(
                article.subCategory || ""
            ).trim();


        element.innerHTML = `

            <div class="article-list-main">

                <div class="article-category">

                    ${escapeHtml(
                        article.category
                    )}

                </div>


                ${
                    subCategory
                    ?
                    `
                    <div class="article-subcategory">

                        ${escapeHtml(
                            subCategory
                        )}

                    </div>
                    `
                    :
                    ""
                }


                <h3>

                    ${escapeHtml(
                        article.title
                    )}

                </h3>


                <p>

                    ${escapeHtml(
                        article.summary
                    )}

                </p>

            </div>


            <span class="article-arrow">
                →
            </span>

        `;


        container.appendChild(
            element
        );

    }

}


/*
========================================
エラー表示
========================================
*/

function showError(
    message
) {

    document
        .getElementById(
            "articles"
        )
        .innerHTML = `

        <div class="empty">

            ${escapeHtml(message)}

        </div>

    `;

}


/*
========================================
HTMLエスケープ
========================================
*/

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/*
========================================
開始
========================================
*/

loadCategory();

</script>

</body>

</html>
