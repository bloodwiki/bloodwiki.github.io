<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>カテゴリ - BLOOD Wiki</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

</head>


<body>

<div class="site">

    <!-- 共通ヘッダー -->
    <div id="site-header"></div>


    <div class="page">

        <!-- 共通サイドバー -->
        <div id="site-sidebar"></div>


        <!-- メイン -->

        <main class="main">

            <div class="content">

                <!-- パンくず -->

                <nav class="breadcrumbs">

                    <a href="index.html">
                        ホーム
                    </a>

                    <span>/</span>

                    <a
                        href="#"
                        id="breadcrumb"
                    >
                        カテゴリ
                    </a>

                </nav>


                <!-- カテゴリ見出し -->

                <header class="page-heading">

                    <div
                        class="eyebrow"
                        id="category-eyebrow"
                    >
                        CATEGORY
                    </div>

                    <h1 id="category-title">
                        カテゴリ
                    </h1>

                    <p id="category-description">
                        Wikiの記事一覧です。
                    </p>

                </header>


                <!-- 記事数 -->

                <div
                    id="article-count"
                    class="article-count"
                >
                </div>


                <!-- 記事一覧 -->

                <div
                    id="articles"
                    class="article-list"
                >

                    <div class="loading">
                        読み込み中...
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- 共通処理 -->

<script src="js/api.js"></script>
<script src="js/layout.js"></script>


<script>

/*
========================================
カテゴリ一覧
========================================
*/

const categories = {

    enemy: {
        name: "敵",
        description:
            "ゲーム内に登場する敵についての情報です。"
    },

    boss: {
        name: "ボス",
        description:
            "ゲーム内に登場するボスについての情報です。"
    },

    fishing: {
        name: "釣り",
        description:
            "釣りで入手できるものや釣り場、釣りに関する情報です。"
    },

    weapon: {
        name: "武器",
        description:
            "武器の性能や入手方法などの情報です。"
    },

    armor: {
        name: "防具",
        description:
            "防具の性能や入手方法などの情報です。"
    },

    accessory: {
        name: "アクセサリー",
        description:
            "アクセサリーの性能や入手方法などの情報です。"
    },

    item: {
        name: "アイテム",
        description:
            "ゲーム内に登場するアイテムについての情報です。"
    },

    npc: {
        name: "NPC",
        description:
            "NPCやショップ、取引などについての情報です。"
    }

};


/*
========================================
カテゴリ読み込み
========================================
*/

async function loadCategory() {

    const params =
        new URLSearchParams(
            location.search
        );


    const category =
        params.get("category");


    const info =
        categories[category];


    /*
    カテゴリが存在しない場合
    */

    if (!info) {

        showError(
            "指定されたカテゴリが存在しません。"
        );

        return;

    }


    /*
    ページタイトル
    */

    document.title =
        info.name +
        " - ○○ Wiki";


    /*
    パンくず
    */

    const breadcrumb =
        document.getElementById(
            "breadcrumb"
        );


    breadcrumb.textContent =
        info.name;


    breadcrumb.href =
        "category.html?category=" +
        encodeURIComponent(
            category
        );


    /*
    見出し
    */

    document
        .getElementById(
            "category-title"
        )
        .textContent =
        info.name;


    document
        .getElementById(
            "category-description"
        )
        .textContent =
        info.description;


    /*
    記事取得
    */

    try {

        const result =
            await getArticles();


        if (!result.success) {

            throw new Error(
                result.error
            );

        }


        /*
        カテゴリで絞り込み
        */

        const articles =
            result.articles.filter(
                article =>
                    article.category ===
                    info.name
            );


        displayArticles(
            articles
        );


    } catch (error) {

        console.error(error);

        showError(
            "記事の読み込みに失敗しました。"
        );

    }

}


/*
========================================
記事一覧表示
========================================
*/

function displayArticles(articles) {

    const container =
        document.getElementById(
            "articles"
        );


    /*
    件数
    */

    document
        .getElementById(
            "article-count"
        )
        .textContent =
        `${articles.length} 件の記事`;


    /*
    一覧を空にする
    */

    container.innerHTML = "";


    /*
    記事がない場合
    */

    if (articles.length === 0) {

        container.innerHTML = `

            <div class="empty">

                このカテゴリにはまだ記事がありません。

            </div>

        `;

        return;

    }


    /*
    記事を生成
    */

    for (const article of articles) {

        const element =
            document.createElement("a");


        element.href =
            "article.html?id=" +
            encodeURIComponent(
                article.id
            );


        element.className =
            "article-list-item";


        element.innerHTML = `

            <div class="article-list-main">

                <div class="article-category">

                    ${escapeHtml(
                        article.category
                    )}

                </div>


                <h3>

                    ${escapeHtml(
                        article.title
                    )}

                </h3>


                <p>

                    ${escapeHtml(
                        article.summary
                    )}

                </p>

            </div>


            <span class="article-arrow">
                →
            </span>

        `;


        container.appendChild(
            element
        );

    }

}


/*
========================================
エラー表示
========================================
*/

function showError(message) {

    document
        .getElementById(
            "articles"
        )
        .innerHTML = `

        <div class="empty">

            ${escapeHtml(message)}

        </div>

    `;

}


/*
========================================
HTMLエスケープ
========================================
*/

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/*
========================================
開始
========================================
*/

loadCategory();

</script>

</body>

</html>
