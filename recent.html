<script src="js/api.js"></script>

<script>

async function loadRecent() {

    const container =
        document.getElementById(
            "articles"
        );


    try {

        const result =
            await getArticles();


        if (!result.success) {
            throw new Error(
                result.error
            );
        }


        const articles =
            [...result.articles]
                .reverse();


        container.innerHTML = "";


        for (
            const article of
            articles
        ) {

            const element =
                document.createElement("a");


            element.href =
                "article.html?id=" +
                encodeURIComponent(
                    article.id
                );


            element.className =
                "article-list-item";


            element.innerHTML = `

                <div class="article-list-main">

                    <div class="article-category">
                        ${escapeHtml(article.category)}
                    </div>

                    <h3>
                        ${escapeHtml(article.title)}
                    </h3>

                    <p>
                        ${escapeHtml(article.summary)}
                    </p>

                </div>

                <span class="article-arrow">
                    →
                </span>

            `;


            container.appendChild(
                element
            );

        }

    } catch (error) {

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                読み込みに失敗しました。
            </div>`;

    }

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


loadRecent();

</script>
