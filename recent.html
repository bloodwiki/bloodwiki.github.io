<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>最近の更新 - BLOOD Wiki</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

</head>


<body>

<div class="site">

    <!-- 共通ヘッダー -->
    <div id="site-header"></div>


    <div class="page">

        <!-- 共通サイドバー -->
        <div id="site-sidebar"></div>


        <main class="main">

            <div class="content">

                <!-- パンくず -->

                <nav class="breadcrumbs">

                    <a href="index.html">
                        ホーム
                    </a>

                    <span>/</span>

                    <strong>
                        最近の更新
                    </strong>

                </nav>


                <!-- ページ見出し -->

                <header class="page-heading">

                    <div class="eyebrow">
                        RECENT
                    </div>

                    <h1>
                        最近の更新
                    </h1>

                    <p>
                        最近更新された記事を確認できます。
                    </p>

                </header>


                <!-- 記事一覧 -->

                <div
                    id="articles"
                    class="article-list"
                >

                    <div class="loading">
                        読み込み中...
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- 共通処理 -->

<script src="js/api.js"></script>
<script src="js/layout.js"></script>


<script>

async function loadRecent() {

    const container =
        document.getElementById(
            "articles"
        );


    try {

        const result =
            await getArticles();


        if (!result.success) {

            throw new Error(
                result.error
            );

        }


        /*
        ================================
        最近更新された順
        ================================
        */

        const articles =
            [...result.articles]
                .reverse();


        container.innerHTML = "";


        /*
        ================================
        記事一覧
        ================================
        */

        for (
            const article of
            articles
        ) {

            const element =
                document.createElement("a");


            element.href =
                "article.html?id=" +
                encodeURIComponent(
                    article.id
                );


            element.className =
                "article-list-item";


            element.innerHTML = `

                <div class="article-list-main">

                    <div class="article-category">

                        ${escapeHtml(
                            article.category
                        )}

                    </div>


                    <h3>

                        ${escapeHtml(
                            article.title
                        )}

                    </h3>


                    <p>

                        ${escapeHtml(
                            article.summary
                        )}

                    </p>

                </div>


                <span class="article-arrow">
                    →
                </span>

            `;


            container.appendChild(
                element
            );

        }

    } catch (error) {

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                読み込みに失敗しました。
            </div>`;

    }

}


/*
========================================
HTMLエスケープ
========================================
*/

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/*
========================================
開始
========================================
*/

loadRecent();

</script>

</body>

</html>
