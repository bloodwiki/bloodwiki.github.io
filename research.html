<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>調査・検証 - ○○ Wiki</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

</head>


<body>

<div class="site">

    <!-- 共通ヘッダー -->
    <div id="site-header"></div>


    <div class="page">

        <!-- 共通サイドバー -->
        <div id="site-sidebar"></div>


        <main class="main">

            <div class="content">

                <!-- パンくず -->

                <nav class="breadcrumbs">

                    <a href="index.html">
                        ホーム
                    </a>

                    <span>/</span>

                    <strong>
                        調査・検証
                    </strong>

                </nav>


                <!-- ページ見出し -->

                <header class="page-heading">

                    <div class="eyebrow">
                        RESEARCH
                    </div>

                    <h1>
                        調査・検証
                    </h1>

                    <p>
                        ゲーム内の仕様や確率など、
                        まだ確定していない情報を調査します。
                    </p>

                </header>


                <!-- Wiki情報 -->

                <div class="info-box">

                    <strong>
                        Wikiの情報について
                    </strong>

                    <p>
                        すべての情報が最初から確定しているとは限りません。
                        実際のゲーム内での検証結果などをもとに、
                        情報の正確性を確認しています。
                    </p>

                </div>


                <!-- 調査中の項目 -->

                <h2 class="simple-heading">
                    調査中の項目
                </h2>


                <div class="research-grid">

                    <div class="research-card">

                        <span class="research-status">
                            調査中
                        </span>

                        <h3>
                            釣りの出現確率
                        </h3>

                        <p>
                            釣りパワーによって各アイテムの
                            出現率がどのように変化するか。
                        </p>

                    </div>


                    <div class="research-card">

                        <span class="research-status">
                            調査中
                        </span>

                        <h3>
                            アクセサリー品質
                        </h3>

                        <p>
                            品質%と実際の性能の関係を調査。
                        </p>

                    </div>


                    <div class="research-card">

                        <span class="research-status">
                            未検証
                        </span>

                        <h3>
                            敵のドロップ率
                        </h3>

                        <p>
                            敵ごとのアイテム出現率を調査。
                        </p>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- 共通処理 -->

<script src="js/api.js"></script>
<script src="js/layout.js"></script>

</body>

</html>
