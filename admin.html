<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理 - BLOOD Wiki</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="site">

    <!-- ヘッダー -->
    <div id="site-header"></div>

    <div class="page">

        <!-- サイドバー -->
        <div id="site-sidebar"></div>

        <!-- メイン -->
        <main class="main">

            <div class="page-heading">
                <div class="page-heading-category">BLOOD Wiki</div>
                <h1>管理</h1>
                <p>Wikiの編集や管理に使用するページです。</p>
            </div>

            <section class="article-list">

                <article class="article-list-item">
                    <div class="article-list-content">
                        <div class="article-list-category">記事管理</div>
                        <h2>記事編集</h2>
                        <p>
                            BLOOD Wikiの記事を編集します。
                            編集画面では、記事の内容やタイトルなどを変更できます。
                        </p>

                        <a
                            href="GAS_WEB_APP_URL"
                            class="button"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            編集画面を開く
                        </a>
                    </div>
                </article>

            </section>

        </main>

    </div>
</div>

<script src="js/layout.js"></script>

</body>
</html>
